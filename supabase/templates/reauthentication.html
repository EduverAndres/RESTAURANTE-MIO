<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>Tu código de verificación</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <span style="display:none;max-height:0;overflow:hidden;color:transparent;">Tu código de verificación de Tienda es {{ .Token }}.</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f5;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border-radius:16px;border:1px solid #e4e4e7;">
            <tr>
              <td style="padding:32px 32px 8px 32px;">
                <p style="margin:0;font-size:20px;font-weight:700;color:#18181b;letter-spacing:-0.01em;">Tienda</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 0 32px;">
                <h1 style="margin:0 0 12px 0;font-size:24px;line-height:32px;font-weight:600;color:#18181b;">Tu código de verificación</h1>
                <p style="margin:0 0 24px 0;font-size:16px;line-height:24px;color:#3f3f46;">
                  Ingresa este código en la aplicación para confirmar que eres tú:
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 32px 24px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f5;border-radius:12px;">
                  <tr>
                    <td align="center" style="padding:16px 32px;font-size:32px;line-height:40px;font-weight:700;letter-spacing:0.3em;color:#18181b;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;">{{ .Token }}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px 32px;border-top:1px solid #e4e4e7;">
                <p style="margin:24px 0 0 0;font-size:13px;line-height:20px;color:#71717a;">
                  El código vence en unos minutos y solo puede usarse una vez. Si no solicitaste este correo, ignóralo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
