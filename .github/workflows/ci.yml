name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy public values: enough for lib/env.ts to validate and for
      # `next build` to compile. Every page that touches Supabase declares
      # `export const dynamic = 'force-dynamic'` and every Supabase client is
      # created lazily per request (lib/supabase/*.ts), so no network call
      # happens at build time.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ROOT_DOMAIN: localhost
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
