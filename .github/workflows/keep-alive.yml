name: Keep alive

# Supabase pauses a Free-tier project after 7 days with no database activity,
# and a paused project answers every request with an error. For a demo that
# is worse than having no demo at all: the one restaurant owner who opens the
# link is the one who sees it broken.
#
# `/api/health` runs a real query against `stores` through RLS, so hitting it
# counts as database activity. Every 6 hours is far inside the 7-day window
# and costs about 30 seconds of Actions time per month.
#
# Set the repository variable HEALTH_URL to the deployed origin, e.g.
#   gh variable set HEALTH_URL --body https://your-project.vercel.app
# The job is skipped while it is unset, so this workflow is harmless before
# the first deploy.
#
# CAVEAT worth knowing: GitHub disables scheduled workflows in a repository
# with no activity for 60 days, and emails the owner first. If this repo goes
# quiet for two months the ping stops and the project sleeps. An external
# scheduler (cron-job.org) has no such rule and is the better home for this
# once the demo matters.

on:
  schedule:
    # Every 6 hours. Minute 17 rather than 0: GitHub's scheduler is congested
    # on the hour and delays are common.
    - cron: '17 */6 * * *'
  workflow_dispatch:

# The ping reads a public, unauthenticated endpoint and writes nothing.
permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${HEALTH_URL:-}" ]; then
            echo "HEALTH_URL is not set; nothing to ping yet."
            exit 0
          fi

          # `/api/health` answers 200 when the database replied and 503 when
          # it did not. Both prove the deployment is reachable, but only 200
          # proves the query ran, and only a query that ran keeps Supabase
          # awake -- so a 503 has to fail this job loudly.
          #
          # --max-time guards against the request hanging until the runner
          # times out; the endpoint itself aborts its probe at 3s.
          body=$(mktemp)
          code=$(curl --silent --show-error --location \
                      --max-time 30 \
                      --output "${body}" \
                      --write-out '%{http_code}' \
                      "${HEALTH_URL%/}/api/health") || {
            echo "Request failed before a response arrived."
            exit 1
          }

          echo "HTTP ${code}"
          cat "${body}"
          echo

          if [ "${code}" != "200" ]; then
            echo "::error::Health check returned ${code}; the database probe did not succeed."
            exit 1
          fi
